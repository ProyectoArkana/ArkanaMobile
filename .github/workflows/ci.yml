# Ruta en el repo ArkanaMobile: .github/workflows/ci.yml
name: CI ArkanaMobile

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build (instalar y compilar)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Análisis estático (ESLint)
        run: npm run lint
      - name: Verificar compilación TypeScript
        run: npx tsc --noEmit

  test:
    name: Pruebas (Jest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas con cobertura
        run: npm test -- --ci --coverage
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-mobile
          path: coverage/
          if-no-files-found: ignore

  resultado:
    name: Resultado del pipeline
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Publicar resultado
        run: |
          B="${{ needs.build.result }}"
          T="${{ needs.test.result }}"
          {
            echo "## Resultado del pipeline - ArkanaMobile"
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Build | $B |"
            echo "| Pruebas | $T |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$B" != "success" ]; then
            echo "**PIPELINE FALLIDO: el build falló, las pruebas NO pudieron ejecutarse.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$T" = "success" ]; then
            echo "**PIPELINE EXITOSO: build correcto y pruebas aprobadas.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**PIPELINE FALLIDO: las pruebas fallaron (revisar el log del job Pruebas).**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
