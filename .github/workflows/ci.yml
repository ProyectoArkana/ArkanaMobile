name: CI Arkana Mobile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacion:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  pruebas:
    name: Pruebas con Jest
    needs: verificacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage --coverageReporters=lcov --coverageReporters=text-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-jest
          path: coverage/
          if-no-files-found: ignore

  resumen:
    name: Resumen
    needs: [verificacion, pruebas]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## Resultado: lint/tipos ${{ needs.verificacion.result }}, pruebas ${{ needs.pruebas.result }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.verificacion.result }}" = "success" ] && [ "${{ needs.pruebas.result }}" = "success" ]
